name: Docker build & run

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: docker build
        run: docker build -t next-docker .

      - name: docker run
        run: docker run -d --name next-docker -p 3000:3000 next-docker

      - name: Esperar a que el contenedor esté saludable
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' next-docker)
            echo "Intento $i: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 3
          done
          docker logs next-docker
          exit 1

      - name: Probar la aplicación
        run: |
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/ | grep -q "Ejecutándose dentro de un contenedor Docker"
          echo "La página confirma que corre dentro de Docker"

      - name: Resumen de la verificación
        run: |
          SIZE=$(docker images next-docker --format '{{.Size}}')
          NODE=$(docker exec next-docker node -p 'process.version')
          ALPINE=$(docker exec next-docker cat /etc/alpine-release)
          USUARIO=$(docker exec next-docker whoami)
          HOST=$(docker exec next-docker hostname)
          HEALTH=$(docker inspect --format '{{.State.Health.Status}}' next-docker)
          PUERTO=$(docker port next-docker 3000 | head -1)
          API=$(curl -fsS http://localhost:3000/api/health)
          PAGINA=$(curl -fsS http://localhost:3000/ | grep -o 'Ejecutándose dentro de un contenedor Docker' | head -1)

          # Anotaciones: visibles en la página pública del workflow sin iniciar sesión
          echo "::notice title=1. Imagen construida::next-docker ($SIZE) sobre Node.js $NODE y Alpine Linux $ALPINE"
          echo "::notice title=2. Contenedor en ejecución::Estado $HEALTH, usuario $USUARIO, hostname $HOST, puerto $PUERTO -> 3000"
          echo "::notice title=3. GET /api/health::$API"
          echo "::notice title=4. Página principal::$PAGINA"

          {
            echo "## Contenedor verificado"
            echo ""
            echo "| Dato | Valor |"
            echo "| --- | --- |"
            echo "| Imagen | \`next-docker\` ($SIZE) |"
            echo "| Node.js | \`$NODE\` |"
            echo "| Sistema base | Alpine Linux $ALPINE |"
            echo "| Usuario del proceso | \`$USUARIO\` |"
            echo "| Hostname (ID del contenedor) | \`$HOST\` |"
            echo "| Estado del HEALTHCHECK | \`$HEALTH\` |"
            echo "| Puerto publicado | \`$PUERTO\` → 3000 |"
            echo "| GET /api/health | \`$API\` |"
            echo "| Página principal | $PAGINA |"
            echo ""
            echo "### docker logs"
            echo '```'
            docker logs next-docker 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Información de la imagen
        if: always()
        run: |
          docker images next-docker
          docker exec next-docker whoami || true
          docker logs next-docker || true
